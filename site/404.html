<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found - Luthien</title>
  <meta name="robots" content="noindex">
  <!-- Cloudflare Pages serves this with a 404 status for any unknown path. Without it, unknown
       paths (including old luthienresearch.org URLs) returned the home page with a 200. Paths are
       absolute because this page is served at whatever URL was requested. -->
  <link rel="icon" type="image/svg+xml" href="/assets/images/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;600;700&family=Lora:wght@400&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #141216; color: #EDE5D8; font-family: 'Lora', Georgia, serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    main { max-width: 520px; text-align: center; }
    .code { font-family: 'JetBrains Mono', monospace; color: #C47B42; font-size: 0.9rem; letter-spacing: 0.06em; margin: 28px 0 10px; }
    h1 { font-family: 'Raleway', sans-serif; font-size: clamp(1.8rem, 5vw, 2.4rem); margin-bottom: 12px; }
    p { color: #C9C1D6; line-height: 1.6; margin-bottom: 24px; }
    nav { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    nav a { color: #EDE5D8; border: 1px solid #28243A; border-radius: 4px; padding: 8px 16px; font-family: 'Raleway', sans-serif; font-weight: 600; font-size: 0.9rem; text-decoration: none; }
    nav a:hover { border-color: #3B9494; }
  </style>
</head>
<body>
  <main>
    <a href="/"><img src="/assets/images/luthien-new.svg" alt="Luthien" style="height: 40px; width: auto;"></a>
    <div class="code">404</div>
    <h1>We couldn't find that page.</h1>
    <p>It may have moved when we reorganized the site.</p>
    <nav>
      <a href="/">Mission and team</a>
      <a href="/tools/">Tools</a>
      <a href="/blog.html">Blog</a>
    </nav>
  </main>
</body>
</html>
