<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://luthien.cc/slack/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&amp;family=Lora:wght@400;500&amp;family=Raleway:wght@600&amp;display=swap" rel="stylesheet">
  <title>Join Seattle AI Safety Slack | Luthien</title>
  <style>
    :root {
      --plum-dark: #141216;
      --surface: #201C2A;
      --divider: #28243A;
      --linen: #EDE5D8;
      --soft-label: #B0A8BE;
      --verdigris: #3B9494;
      --signal-red: #C45050;
    }

    * {
      box-sizing: border-box;
    }

    body {
      align-items: center;
      background: var(--plum-dark);
      color: var(--linen);
      display: flex;
      font-family: "Lora", Georgia, serif;
      justify-content: center;
      margin: 0;
      min-height: 100vh;
      padding: 24px;
    }

    main {
      background: var(--surface);
      border: 1px solid var(--divider);
      border-radius: 3px;
      box-shadow: 0 1px 6px rgba(0, 0, 0, 0.25);
      max-width: 620px;
      padding: clamp(28px, 7vw, 52px);
      text-align: center;
      width: 100%;
    }

    h1 {
      font-family: "Raleway", sans-serif;
      font-size: clamp(1.9rem, 7vw, 3rem);
      letter-spacing: -0.02em;
      line-height: 1.12;
      margin: 0 0 20px;
    }

    p {
      color: var(--soft-label);
      line-height: 1.6;
      margin: 0 auto 24px;
      max-width: 480px;
    }

    .button {
      background: var(--verdigris);
      border: 1px solid var(--verdigris);
      border-radius: 3px;
      color: var(--plum-dark);
      display: inline-block;
      font-family: "JetBrains Mono", monospace;
      font-size: 0.9rem;
      font-weight: 500;
      padding: 13px 20px;
      text-decoration: none;
    }

    .button:focus-visible,
    .button:hover {
      background: var(--linen);
      border-color: var(--linen);
    }

    .email-button {
      background: transparent;
      border: 0;
      color: var(--verdigris);
      cursor: pointer;
      font: inherit;
      padding: 0;
      text-decoration: underline;
    }

    .email-button:focus-visible,
    .email-button:hover {
      color: var(--linen);
    }

    .fallback {
      border-top: 1px solid var(--divider);
      margin-top: 28px;
      padding-top: 24px;
    }

    .fallback p {
      margin-bottom: 0;
    }

    .meta {
      font-family: "JetBrains Mono", monospace;
      font-size: 0.78rem;
      margin: 24px auto 0;
    }

    a {
      color: var(--verdigris);
    }

    .error {
      color: var(--signal-red);
    }
  </style>
</head>
<body>
  <main>
    <h1>Seattle AI Safety</h1>
    <p id="status" class="error" aria-live="polite" hidden></p>
    <a id="join-link" class="button" href="#" hidden>Join Slack</a>
    <p class="meta">Last updated <span id="updated-at">today</span>.</p>
    <div class="fallback">
      <p><button id="show-help" class="email-button" type="button">Broken?</button></p>
      <p id="broken-help" hidden>Slack links expire every 30 days and renew automatically. <a href="https://slack.com/help/articles/360060363633-Manage-pending-invitations-and-invite-links-for-your-workspace">Slack docs</a>. If broken, <button id="show-email" class="email-button" type="button">email Scott</button><a id="email-link" hidden></a>.</p>
    </div>
    <noscript>
      <p class="error">JavaScript is required.</p>
    </noscript>
  </main>
  <script src="slack.js?v=961e919726ce"></script>
</body>
</html>
